function save(){
  try{localStorage.setItem(KEY,JSON.stringify({role:state.role,inquiries:state.inquiries,contracts:state.contracts,pending:state.pending,inbound:state.inbound,stock:state.stock,suppliers:state.suppliers,deliveries:state.deliveries,pays:state.pays,salesPrice:state.salesPrice,seq:state.seq}));}catch(e){}
}
function logAudit(action,detail){
  state.audit=state.audit||[];
  state.audit.unshift({t:new Date().toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}),u:ROLE_DEF[state.role].name,a:action,d:detail||''});
  if(state.audit.length>200)state.audit.length=200;
}
(function boot(){
  try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.role){Object.assign(state,d);state.role=d.role;document.getElementById('login').classList.add('hide');render();toast('已恢复上次演示状态 · 头像菜单可重置数据');return;}}catch(e){}
})();

function toggleInq(id){state.selInquiry=state.selInquiry===id?null:id;render();}
function quotePanel(r){
  if(!r.quotes.length)return `<div class="quote-panel"><div class="empty">该询价行暂无供应商回复 —— 点击下方按钮向上游发起采购回复</div>
    <div style="padding:0 12px 12px">${has('quote')?`<button class="btn pri" onclick="event.stopPropagation();requestQuote(${r.id})">发起采购回复（向 3 家供应商询价）</button>`:''}</div></div>`;
  const best=Math.min(...r.quotes.map(q=>q.price));
  return `<div class="quote-panel">
    <div style="padding:9px 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <b>采购回复 · 比价</b><span class="mini">型号 ${r.model} · ${r.quotes.length} 家已回复</span><span style="flex:1"></span>
      <button class="btn sm" onclick="event.stopPropagation();toast('已生成采购报价趋势图（演示）')">采购报价趋势</button>
      <button class="btn sm" onclick="event.stopPropagation();toast('已标记无货（演示）')">无货</button>
    </div>`+
    r.quotes.map(q=>`<div class="qrow ${q.price===best?'best':''}">
      <span class="qsup">${q.sup}</span>
      <span class="mini">批号</span><b>${q.batch}</b>
      <span class="mini">数量</span><span class="num">${q.qty.toLocaleString()}</span>
      <span class="mini">采购价</span><b class="num" style="color:${q.price===best?'var(--ok)':'var(--ink)'}">RMB ${fmt(q.price)}</b>
      <span class="mini">货期</span><span>${q.lead}</span>
      <span class="mini">建议售价</span><b class="num" style="color:var(--head)">RMB ${fmt(q.price*MARKUP)}</b>
      ${has('quote')?`<button class="btn sm pri" onclick="event.stopPropagation();pickQuote(${r.id},'${q.sup}')">选用并报价</button>`:''}</div>`).join('')+
    `<div style="padding:9px 12px"><button class="btn sm ok" onclick="event.stopPropagation();printQuote('${r.no}')">预览 / 打印客户报价单</button>
    ${has('contract')&&r.quote?`<button class="btn sm pri" onclick="event.stopPropagation();createContractFromInquiry(${r.id})">生成采购合同</button>`:''}</div></div>`;
}
function requestQuote(id){
  const r=state.inquiries.find(x=>x.id===id);
  r.quotes=r.quotes.length?r.quotes:[{sup:'世康电子',price:+(r.quote*0.9).toFixed(2),qty:r.qty*2,batch:'26+',lead:'3周'},{sup:'泓泽泰电子',price:+(r.quote*0.93).toFixed(2),qty:r.qty,batch:'25+',lead:'2周'}];
  toast(`已向 ${r.quotes.length} 家供应商发起采购回复，收到报价`);save();render();
}
function pickQuote(id,sup){
  const r=state.inquiries.find(x=>x.id===id);
  const q=r.quotes.find(x=>x.sup===sup);
  r.quote=q.price;r.st='已报价';state.salesPrice[r.model]=q.price*MARKUP;
  logAudit('选用供应商报价',r.model+' @ '+sup);toast(`已选用 ${sup} 报价，建议售价 RMB ${fmt(q.price*MARKUP)}，报价单已更新`);save();render();
}

      ${rows.map(r=>`<tr>${[r.model,r.brand,r.qty.toLocaleString(),r.pkg,r.dc||'—',fmt(r.quote),fmt(r.qty*r.quote)].map(v=>`<td style="border:1px solid #ccc;padding:6px 9px">${v}</td>`).join('')}</tr>`).join('')}

function openNewInquiry(){
  openModal('新增询价行',`<div class="frow"><label>询价单号</label><input id="niNo" value="E${today()}01"></div>
  <div class="frow"><label>型号</label><input id="niModel" placeholder="如 STM32F407VET6"></div>
  <div class="frow"><label>品牌</label><input id="niBrand" placeholder="如 ST"></div>
  <div class="frow"><label>数量</label><input id="niQty" type="number" placeholder="1000"></div>
  <div class="frow"><label>封装</label><input id="niPkg" placeholder="如 LQFP-100"></div>`,
  `<button class="btn" onclick="closeModal()">取消</button><button class="btn pri" onclick="saveNewInquiry()">保存</button>`);
}
function saveNewInquiry(){
  const m=document.getElementById('niModel').value.trim(),q=+document.getElementById('niQty').value;
  if(!m||!q){toast('请填写型号与数量');return;}
  state.inquiries.push({id:Date.now(),no:document.getElementById('niNo').value,status:'有效',sales:ROLE_DEF[state.role].name,model:m,brand:document.getElementById('niBrand').value||'—',qty:q,tax:0,target:0,quote:0,pkg:document.getElementById('niPkg').value||'—',dc:'',st:'未报价',quotes:[]});
  closeModal();toast('询价行已新增，可发起采购回复');save();render();
}

function black(name){
  openModal('拉黑供应商',`<p style="margin-bottom:10px">确认将 <b>${name}</b> 拉入黑名单？拉黑后禁止新建采购合同，操作将记入审计日志。</p>
  <div class="frow"><label>拉黑原因</label><select id="blkR"><option>疑似假货/翻新</option><option>交期恶劣</option><option>价格异常</option><option>其他</option></select></div>`,
  `<button class="btn" onclick="closeModal()">取消</button><button class="btn danger" onclick="doBlack('${name}')">确认拉黑</button>`);
}
function doBlack(name){const s=state.suppliers.find(x=>x.name===name);s.status='拉黑';closeModal();logAudit('拉黑供应商',name+' · '+document.getElementById('blkR').value);toast(`${name} 已拉黑（原因：${document.getElementById('blkR').value}），审计日志已记录`);save();render();}

function renderContract(){
  const tabs=['草拟','待审','已审','未到货'];
  const gf=state.gFilter.toLowerCase();
  const rows=state.contracts.filter(c=>c.status===state.contractsTab&&(!gf||(c.model+c.brand+c.no).toLowerCase().includes(gf)));
  const cnt=s=>state.contracts.filter(c=>c.status===s).length;
  return bar(`<span class="crumb">数量勾稽：合同数量 = 已采购 + 待采购 · 已入库 ≤ 合同数量 · 点击单号看详情</span><span class="spacer"></span>
    <button class="btn" onclick="exportCSV('contract')">${I.down} 导出明细EXCEL</button>
    ${has('contract')?`<button class="btn pri" onclick="openNewContract()">新增合同</button>`:''}`)
  + `<div class="card"><div class="card-h">`+tabs.map(t=>`<span class="tag ${state.contractsTab===t?(t==='待审'?'tg-red':t==='草拟'?'tg-amber':'tg-blue'):'tg-gray'}" style="cursor:pointer" onclick="state.contractsTab='${t}';render()">${t} ${cnt(t)}</span>`).join('')
  + `<span style="flex:1"></span><span class="hint">采购员：曹珏</span></div>
  <table><tr><th>采购单号/内部单号</th><th>型号</th><th>品牌</th><th>封装</th><th class="num">合同数量</th><th class="num">已采购</th><th class="num">待采购</th><th class="num">税率</th><th class="num">单价</th><th class="num">金额</th><th>销售员</th><th>交货日期</th><th>操作</th></tr>`+
  (rows.length?rows.map(c=>{

    <span class="gl">单价 / 税率</span><span style="font-family:var(--mono)">${fmt(c.price)} RMB / ${c.tax.toFixed(1)}%</span><span class="gl">金额</span><b style="font-family:var(--mono)">¥ ${fmt(c.price*c.qty)}</b>

/* ================= 交期对比 ================= */

  const rows=state.deliveries;

  return bar(`<span class="crumb">承诺交期 vs 实际交期 · 作为下次选商依据（数据来源于历史到货记录）</span>`)
  + `<div class="kpis" style="grid-template-columns:repeat(3,1fr)">
    <div class="kpi"><div class="l">整体交期达成率</div><div class="v" style="color:${ok/rows.length>=.8?'var(--ok)':'var(--amber)'}">${Math.round(ok/rows.length*100)}%</div></div>
    <div class="kpi"><div class="l">平均提前/延误</div><div class="v">${avg}<small> 天</small></div></div>
    <div class="kpi"><div class="l">重点跟踪供应商</div><div class="v" style="color:var(--danger);font-size:18px;line-height:1.5">盛鑫弘辉</div></div></div>
  <div class="card"><table><tr><th>型号</th><th>供应商</th><th class="num">承诺交期(天)</th><th class="num">实际交期(天)</th><th class="num">偏差</th><th>结论</th></tr>`+
  rows.map(r=>{const d=r.actual-r.promised;return `<tr class="row"><td style="font-weight:600;color:var(--ink)">${r.model}</td><td>${r.sup}</td>
  <td class="num">${r.promised}</td><td class="num">${r.actual}</td><td class="num" style="color:${d>0?'var(--danger)':d<0?'var(--ok)':'var(--ink2)'};font-weight:700">${d>0?'+':''}${d}</td>
  <td><span class="tag ${d>2?'tg-red':d>0?'tg-amber':'tg-green'}">${d>2?'严重延误':d>0?'轻微延误':'达成'}</span> <span class="mini">${r.note}</span></td></tr>`;}).join('')+`</table></div>`;
}

/* ================= 采购利润 / 提成 ================= */
function profitRows(){
  return state.contracts.filter(c=>['已审','未到货'].includes(c.status))
    .map(c=>{const sp=state.salesPrice[c.model]||c.price*MARKUP;return {...c,sp,profit:(sp-c.price)*c.qty,rate:(sp-c.price)/sp*100};});
}
function renderProfit(){
  const gf=state.gFilter.toLowerCase();
  const rows=profitRows().filter(r=>!gf||(r.model+r.no).toLowerCase().includes(gf));
  const tp=rows.reduce((s,r)=>s+r.profit,0);
  return bar(`<span class="crumb">利润 = (建议售价 − 采购价) × 数量 · 建议售价默认采购价 ×1.15，选用比价后自动更新</span><span class="spacer"></span>
    <button class="btn" onclick="exportCSV('profit')">${I.down} 导出</button>
    <span class="tag tg-green">合计毛利 ¥ ${fmt(tp)}</span>`)
  + `<div class="card"><table><tr><th>采购单号</th><th>型号</th><th>采购员</th><th class="num">数量</th><th class="num">采购价</th><th class="num">建议售价</th><th class="num">单行毛利</th><th class="num">行毛利合计</th><th class="num">毛利率</th></tr>`+
  rows.map(r=>`<tr class="row"><td class="code">${r.no}</td><td style="font-weight:600;color:var(--ink)">${r.model}</td><td>${r.buyer}</td>
  <td class="num">${r.qty.toLocaleString()}</td><td class="num">${fmt(r.price)}</td><td class="num">${fmt(r.sp)}</td>
  <td class="num">${fmt(r.sp-r.price)}</td><td class="num" style="font-weight:700;color:var(--ok)">¥ ${fmt(r.profit)}</td>
  <td class="num"><span class="tag ${r.rate>=12?'tg-green':'tg-amber'}">${r.rate.toFixed(1)}%</span></td></tr>`).join('')+`</table></div>`;
}
function renderCommission(){
  const rows=profitRows();
  const by={};
  rows.forEach(r=>{const rate=r.rate>=15?0.08:0.05;(by[r.buyer]=by[r.buyer]||{amt:0,fee:0}).amt+=r.profit;by[r.buyer].fee+=r.profit*rate;});
  return bar(`<span class="crumb">提成规则：行毛利率 ≥15% 按 8% 提成，其余按 5% · 每月 1 日生成上月提成表</span>`)
  + `<div class="card"><div class="card-h">本月采购提成表（草稿）</div>
  <table><tr><th>采购员</th><th class="num">利润额合计</th><th>适用规则</th><th class="num">提成金额</th><th>状态</th></tr>`+
  Object.keys(by).map(k=>`<tr><td style="font-weight:600;color:var(--ink)">${k}</td><td class="num">¥ ${fmt(by[k].amt)}</td>
  <td><span class="mini">混合档（5% / 8% 阶梯）</span></td><td class="num" style="font-weight:700;color:var(--ok)">¥ ${fmt(by[k].fee)}</td>
  <td><span class="tag tg-amber">待财务确认</span></td></tr>`).join('')+`</table></div>
  <div class="card"><div class="card-h">行级提成明细</div><table><tr><th>采购单号</th><th>型号</th><th class="num">行毛利</th><th class="num">毛利率</th><th class="num">提成比例</th><th class="num">提成</th></tr>`+
  rows.map(r=>`<tr><td class="code">${r.no}</td><td>${r.model}</td><td class="num">¥ ${fmt(r.profit)}</td>
  <td class="num">${r.rate.toFixed(1)}%</td><td class="num">${r.rate>=15?'8%':'5%'}</td><td class="num" style="font-weight:700">¥ ${fmt(r.profit*(r.rate>=15?0.08:0.05))}</td></tr>`).join('')+`</table></div>`;
}

function reqPay(no){

function registerIn(id){
  const r=state.pending.find(x=>x.id===id);

  state.inbound.unshift({no,sup:r.sup,type:r.type,wh:'深圳仓库',buyer:'曹珏',reg:'蒙菊',date:new Date().toLocaleDateString('zh-CN').replace(/\//g,'-'),status:'已入仓'});

  <div class="card"><div class="card-h">销售订单<span class="hint">点击出库后库存实时扣减，毛利进入经营看板</span></div>

  rows.map(o=>`<tr class="row"><td class="code">${o.no}</td><td>${o.customer}</td><td style="font-weight:600;color:var(--ink)">${o.model}</td>
  <td class="num">${o.qty.toLocaleString()}</td><td class="num">${fmt(o.price)}</td><td class="num">${fmt(o.cost)}</td>
  <td class="num" style="color:var(--ok);font-weight:700">¥ ${fmt((o.price-o.cost)*o.qty)}</td>
  <td><span class="tag ${o.status==='已出库'?'tg-green':'tg-amber'}">${o.status}</span></td>
  <td>${o.status==='待出库'&&has('inbound')?`<button class="btn sm pri" onclick="doOutbound('${o.no}')">出库扣减</button>`:o.status==='待出库'?'<span class="mini">待仓管出库</span>':'<span class="mini">—</span>'}</td></tr>`).join('')+`</table></div>`;
}
function doOutbound(no){
  const o=state.orders.find(x=>x.no===no);
  const lots=state.stock.filter(s=>s.model===o.model&&s.qty>0);
  const avail=lots.reduce((s,l)=>s+l.qty,0);
  if(avail<o.qty){toast(`出库失败：${o.model} 在库 ${avail.toLocaleString()}，不足 ${o.qty.toLocaleString()}`);return;}
  let need=o.qty;
  lots.forEach(l=>{const take=Math.min(l.qty,need);l.qty-=take;need-=take;});
  o.status='已出库';
  logAudit('销售出库',no+' · '+o.model+' × '+o.qty.toLocaleString()+'（FIFO）');
  toast(`${no} 已出库，${o.model} 库存按 FIFO 扣减 ${o.qty.toLocaleString()} 件`);save();render();
}

function exportCSV(kind){

    data=state.inquiries.map(r=>[r.no,r.status,r.sales,r.model,r.brand,r.qty,r.tax+'%',r.target||'',r.quote||'',r.pkg,r.dc,r.st]);
  }else if(kind==='contract'){
    name='采购合同明细';head=['单号','型号','品牌','封装','合同数量','已入库','待采购','税率','单价','金额','销售员','交货日期','状态'];
    data=state.contracts.map(c=>[c.no,c.model,c.brand,c.pkg,c.qty,c.done,c.qty-c.done,c.tax+'%',c.price,(c.price*c.qty).toFixed(2),c.sales,c.due,c.status]);
  }else if(kind==='profit'){
    name='采购利润';const rows=profitRows();
    head=['采购单号','型号','数量','采购价','建议售价','行毛利','毛利率'];
    data=rows.map(r=>[r.no,r.model,r.qty,r.price,r.sp.toFixed(4),r.profit.toFixed(2),(r.rate*100).toFixed(1)+'%']);
  }else if(kind==='stock'){
    name='库存明细';head=['型号','品牌','封装','批号','数量','仓库','来源入库单','入库单价'];
    data=state.stock.map(r=>[r.model,r.brand,r.pkg,r.lot,r.qty,r.wh,r.ref,r.price]);
  }else if(kind==='sup'){
    name='供应商';head=['供应商','类型','状态','成交次数','交期达成率','质检不良率','KPI'];
    data=state.suppliers.map(s=>[s.name,s.type,s.status,s.deals,s.ontime+'%',s.defect+'%',s.kpi]);
  }else if(kind==='finance'){
    name='应付应收';head=['类型','对象','账龄','金额'];
    data=[...(state.ap||[]).map(a=>['应付',a.sup,a.aging,a.amt]),...(state.ar||[]).map(a=>['应收',a.cust,a.aging,a.amt])];
  }else if(kind==='pay'){
    name='付款申请';head=['申请单号','类型','关联合同','供应商','金额','申请人','日期','状态'];
    data=state.pays.map(p=>[p.no,p.type,p.contract,p.sup,p.amount,p.by,p.date,p.status]);
  }
  const csv='\ufeff'+[head.join(','),...data.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(','))].join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download=`芯掌柜-${name}-${today()}.csv`;a.click();
  toast(`已导出 ${name}.csv（${data.length} 行，Excel/WPS 可直接打开）`);
}

/* ================= 弹窗/搜索 ================= */
function openModal(t,body,foot,wide){
  const m=document.getElementById('modal');
  m.className='modal'+(wide?' wide':'');
  m.innerHTML=`<div class="mh">${t}<span class="x" onclick="closeModal()">×</span></div><div class="mb">${body}</div><div class="mf">${foot}</div>`;
  document.getElementById('mask').classList.add('show');
}
function closeModal(){document.getElementById('mask').classList.remove('show');}
function globalSearch(v){state.gFilter=v;if(['quote','contract','pending','inbound','stock','pay','profit'].includes(state.page))render();}

/* ================= 启动 ================= */
document.addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement.tagName!=='INPUT'){e.preventDefault();document.getElementById('gs').focus();}});
</script>
